# Zenodotus -> Codex CLI fold map
#
# Maps every agents/*.md and commands/*.md file to where its content lives in the Codex-targeted
# skills output tree, since Codex has no per-file tool-scoped subagent primitive and its custom
# prompts mechanism is deprecated in favor of Skills (see FEAT-codex-port.md's DDD notes and the
# approved plan at ~/.claude/plans/how-to-have-the-crystalline-bird.md).
#
# TOML, not YAML: read with Python's stdlib `tomllib` (3.11+, read-only) so the generator needs no
# external dependency, matching install.sh's existing zero-dependency install-tooling ethos, and
# matching Codex's own config.toml format.
#
# kind = "fold": append the source file's substantive content as a new titled section onto an
#   existing (or new-in-this-map) skill in the output tree. The source file itself is never copied.
# kind = "relocate": the source's *behavior* (not literal text) is rewritten directly into a
#   skill's own body by a human, not mechanically extracted by the generator — currently only zeno.md.
#
# role_prefix is derived from the source agent's `tools:` frontmatter (Advisor = no Write/Edit,
# Owner = has Write/Edit) and is written as the first line of the folded section, since Codex
# skills carry no tool-grant ACL of their own — see approved plan §2, Class C.

[meta]
# New skills this fold map requires (created in STORY-codex-orphan-skills) - 9 total.
# Declared here, before any [[array-of-tables]] section, so it stays a root-level key under TOML's
# rules rather than silently attaching to whichever [[table]] happened to be open last.
new_skills = [
  "skills/zeno-stack/zeno-build-resolver/SKILL.md",
  "skills/zeno-stack/zeno-comment-analysis/SKILL.md",
  "skills/zeno-stack/zeno-harness-optimizer/SKILL.md",
  "skills/zeno-stack/zeno-performance-profiling/SKILL.md",
  "skills/zeno-stack/zeno-planning/SKILL.md",
  "skills/zeno-stack/zeno-refactor-cleanup/SKILL.md",
  "skills/zeno-stack/zeno-cost-report/SKILL.md",
  "skills/zeno-stack/zeno-model-route/SKILL.md",
  "skills/zeno-stack/zeno-sessions/SKILL.md",
]

[[excluded]]
path = "agents/REGISTRY.md"
reason = "Governs Claude Code's Task-tool subagent dispatch model, which Codex has no equivalent primitive for. Read by this fold map as input, never ported itself."

[[excluded]]
path = "agents/_agent-template.md"
reason = "Authoring template for the Claude-Code-only agent contract shape; not user-facing content."

[[excluded]]
path = "commands/skill-evals.md"
reason = "Maintainer-only tooling for the library itself (runs a skill's evals.json suite), not library content."

[[excluded]]
glob = "skills/**/evals/evals.json"
reason = "Test fixtures for commands/skill-evals.md's grading harness; travel with it, out of scope."

